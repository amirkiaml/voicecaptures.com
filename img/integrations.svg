@keyframes gBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@media (prefers-reduced-motion: reduce){
  .g *{animation:none!important}
  .g .chip,.g .call{opacity:1!important} .g .pulse{opacity:0!important}
}


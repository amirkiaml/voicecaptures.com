<![CDATA[
.g{display:block;width:100%;height:auto}
.g text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.g .vclogo-t{font-weight:800;letter-spacing:-.01em}
.g .cn{font-size:19px;font-weight:700;fill:#EAF0FF}
.g .cs{font-size:15px;font-weight:500;fill:#93A3C9}
.g .ct{font-size:13px;font-weight:600;fill:#7488B8}
